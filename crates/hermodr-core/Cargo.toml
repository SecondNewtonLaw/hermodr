[package]
name = "hermodr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WhatsApp protocol core for Hermóðr, built on whatsapp-rust"

[dependencies]
whatsapp-rust = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
# Renders the pairing QR to the terminal. Kept in-crate so the spike has no
# system dependency like `qrencode`.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# The UI consumes these types directly over Tauri IPC.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Fetches Open Graph metadata for link previews on outgoing messages.
ureq = "3"
