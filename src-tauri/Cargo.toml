[package]
name = "hermodr"
version = "0.1.0"
description = "Hermóðr: a native WhatsApp client"
authors = ["emiliano-go"]
edition = "2021"

[lib]
name = "hermodr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { path = "../../tauri/crates/tauri-build", features = [] }

[dependencies]
# The native protocol client. This is what replaced the embedded WhatsApp Web
# webview, and with it the whole class of memory and history problems.
hermodr-core = { path = "../crates/hermodr-core" }
tauri = { path = "../../tauri/crates/tauri", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
