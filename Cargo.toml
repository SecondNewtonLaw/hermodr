[workspace]
members = ["crates/hermodr-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/emiliano-go/hermodr"

[workspace.dependencies]
# `simd` is the only default feature that needs nightly Rust, so it is excluded
# and the rest are opted into explicitly. This keeps the build on stable.
whatsapp-rust = { version = "0.7", default-features = false, features = [
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "tokio-native",
    "ureq-client",
    "signal",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
